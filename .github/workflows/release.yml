name: Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发，如 v1.0.0, v1.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Allow-Blocked-Apps.alfredworkflow
          generate_release_notes: true
          body: |
            ## 📦 安装方法

            1. 下载下方的 `Allow-Blocked-Apps.alfredworkflow` 文件
            2. 双击文件进行安装
            3. 在 Alfred 中输入 `allow` 即可使用

            ## 💻 系统要求

            - macOS 10.15 (Catalina) 或更高版本
            - Alfred 4+ (需要 Powerpack)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
